# /etc/nginx/sites-available/aztec.az
# Enable:  ln -s /etc/nginx/sites-available/aztec.az /etc/nginx/sites-enabled/
# Reload:  nginx -t && systemctl reload nginx

upstream aztec_backend {
    server unix:/run/gunicorn/aztec.sock;
}

# -------- HTTP -> HTTPS redirect (uncomment after SSL is set up) --------
# server {
#     listen 80;
#     listen [::]:80;
#     server_name aztec.az www.aztec.az 94.20.59.240;
#     return 301 https://aztec.az$request_uri;
# }

# -------- Main server block (HTTP; switch to 443 ssl after certbot) --------
server {
    listen 80;
    listen [::]:80;
    server_name aztec.az www.aztec.az 94.20.59.240;

    # --- SSL (uncomment after `certbot --nginx -d aztec.az -d www.aztec.az`) ---
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/aztec.az/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aztec.az/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # ---- Static frontend (HTML/CSS/JS) ----
    root /var/www/aztec.az/frontend;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ---- Django admin / rosetta / API -> gunicorn ----
    location /admin/   { try_files $uri @django; }
    location /rosetta/ { try_files $uri @django; }
    location /api/     { try_files $uri @django; }

    # ---- Django collected static (admin, jazzmin, rosetta assets) ----
    location /static/ {
        alias /var/www/aztec.az/backend/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ---- User-uploaded media (hero images, services/videos, etc.) ----
    location /media/ {
        alias /var/www/aztec.az/backend/media/;
        expires 30d;
        access_log off;
    }

    # ---- Frontend SPA/static fallback ----
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ---- Reverse proxy to gunicorn ----
    location @django {
        proxy_pass http://aztec_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
