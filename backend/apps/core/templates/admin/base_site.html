{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | {{ site_title|default:_('Aztec Admin') }}{% endblock %}

{% block extrastyle %}{{ block.super }}
<style>
  #header { background: #111; color: #fff; padding: 12px 40px; }
  #header a:link, #header a:visited { color: #fff; }
  #branding { display: flex; align-items: center; }
  #branding h1 { margin: 0; font-weight: 600; font-size: 18px; display: flex; align-items: center; gap: 12px; }
  #branding h1 img { height: 40px; width: auto; display: block; }
  #branding h1 .aztec-brand-text { letter-spacing: 1px; text-transform: uppercase; }
  #user-tools { color: #ddd; }
  #user-tools a { border-bottom: none !important; }
  div.breadcrumbs { background: #1b1b1b; color: #ccc; padding: 10px 40px; }
  div.breadcrumbs a { color: #ffb300; }
  .module h2, .module caption, .inline-group h2 { background: #222; }
  a:link, a:visited { color: #0a66c2; }
  .button, input[type=submit], input[type=button], .submit-row input, a.button { background: #0a66c2; }
  .button:hover, input[type=submit]:hover, input[type=button]:hover { background: #074a8f; }
  .button.default, input[type=submit].default, .submit-row input.default { background: #ffb300; color: #111; }
  .button.default:hover, input[type=submit].default:hover { background: #e0a000; }
</style>
{% endblock %}

{% block branding %}
<div id="site-name">
  <h1 id="site-name-h1">
    <a href="{% url 'admin:index' %}" style="display:flex;align-items:center;gap:12px;text-decoration:none">
      <img src="{% static 'admin/img/aztec-logo.webp' %}" alt="Aztec Construction">
      <span class="aztec-brand-text">Aztec Admin</span>
    </a>
  </h1>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}
